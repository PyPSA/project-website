repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
        exclude: ^tsconfig\.json$
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, svelte, css, json, yaml, markdown]
        exclude: ^(package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        types_or: [javascript, ts, svelte]
        exclude: ^(build|\.svelte-kit|src/lib/data|src/lib/components/ui)/
        pass_filenames: true
